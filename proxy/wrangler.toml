name = "habit-planner-ai-proxy"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Non-secret configuration.
[vars]
# Every request is forced to this model. Leave it here to protect a shared key.
MODEL = "openai/gpt-oss-20b"

# Secrets are set with `wrangler secret put` and are never committed:
#   GROQ_API_KEY  the Groq key the proxy uses (required)
#   PROXY_TOKEN   optional shared token clients must send as their API key
